<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichar</title><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F7F6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fichar">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap"><style>/* Capa: la pantalla entera cambia de color según el estado. Costura: las horas se dibujan como puntadas. */
:root{
  --bg:#F7F7F6;--surface:#FFFFFF;--tint:#EDEDEB;--text:#141414;--muted:#5A5A5A;--line:#D6D6D2;
  --red:#982626;--red-press:#7E1F1F;--red-text:#982626;--on-red:#FFFFFF;
  --warn-bg:#FFF4D6;--warn-text:#5C4200;--warn-line:#E3B341;
  --scrim:rgba(20,20,20,.42);--toast:#141414;--sheet-shadow:0 -12px 40px rgba(20,20,20,.16);
  --display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --gutter-l:max(20px,env(safe-area-inset-left,0px));--gutter-r:max(20px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161615;--surface:#222220;--tint:#2B2B29;--text:#F4F4F2;--muted:#A9A9A5;--line:#3A3A37;
  --red:#A62C2C;--red-press:#8A2424;--red-text:#F0A3A3;
  --warn-bg:#3A2F12;--warn-text:#F5DC9A;--warn-line:#8A6B1F;--scrim:rgba(0,0,0,.6);--toast:#3A3A37;--sheet-shadow:0 -12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161615;--surface:#222220;--tint:#2B2B29;--text:#F4F4F2;--muted:#A9A9A5;--line:#3A3A37;
  --red:#A62C2C;--red-press:#8A2424;--red-text:#F0A3A3;
  --warn-bg:#3A2F12;--warn-text:#F5DC9A;--warn-line:#8A6B1F;--scrim:rgba(0,0,0,.6);--toast:#3A3A37;--sheet-shadow:0 -12px 40px rgba(0,0,0,.5);color-scheme:dark}

html{height:100%;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--body);overscroll-behavior:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,p,ol,ul{margin:0;padding:0}ol,ul{list-style:none}
::selection{background:var(--red);color:var(--on-red)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* Pantalla de fichar */
.ficha{--fg:var(--text);--fg2:var(--muted);--raya:var(--line);position:relative;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);padding-inline:var(--gutter-l) var(--gutter-r);padding-top:env(safe-area-inset-top,0px);transition:background-color 200ms ease}
.ficha[data-estado="dentro"]{--fg:var(--on-red);--fg2:#F2D5D5;--raya:rgba(255,255,255,.34);background:var(--red)}
.ficha>*{width:100%;max-width:440px;margin-inline:auto}
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.logo{height:15px;width:auto;display:block}
.ficha[data-estado="dentro"] .logo{filter:brightness(0) invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.enlace{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-inline:4px;font-weight:600;font-size:15px;transition:opacity 120ms ease}
.enlace:active{opacity:.6}
.enlace svg{width:16px;height:16px}
.centro{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-block:8px}
.estado{font-size:18px;font-weight:600;color:var(--fg)}
.reloj{font:800 clamp(64px,22vw,92px)/.98 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:6px}
.reloj small{font:700 .42em var(--display);letter-spacing:-.02em;margin-inline:.08em .2em}
.pie-reloj{margin-top:8px;color:var(--fg2);font-size:15px}
.costura{display:block;width:100%;height:36px;overflow:visible;color:var(--fg)}
.costura text{font:500 11px var(--body);fill:var(--fg2);font-variant-numeric:tabular-nums}
.semana-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.semana-cab b{font-weight:700;font-variant-numeric:tabular-nums}
.semana-cab span{color:var(--fg2)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px;border-top:1px solid var(--raya)}
.dias li{padding-top:8px;display:grid;gap:2px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg2)}
.dias b{font-weight:600;color:var(--fg);font-size:14px}
.dias li.hoy span{color:var(--fg);font-weight:700}
.accion{padding-block:10px calc(16px + env(safe-area-inset-bottom,0px))}
.boton{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:14px;padding-inline:20px;font-weight:700;font-size:17px;transition:transform 140ms var(--ease-out),background-color 120ms ease}
.boton:active{transform:scale(.97)}
.boton[disabled]{opacity:.5;cursor:default}
.boton.rojo{background:var(--red);color:var(--on-red)}
.boton.rojo:active{background:var(--red-press)}
.boton.suave{background:var(--tint);color:var(--text)}
.fichar{min-height:92px;border-radius:20px;font:700 25px var(--display);letter-spacing:-.01em;background:var(--red);color:var(--on-red)}
.fichar:active{background:var(--red-press)}
.ficha[data-estado="dentro"] .fichar{background:var(--on-red);color:#7E1F1F}
.ficha[data-estado="dentro"] .fichar:active{background:#F2E4E4}
.pendiente{display:flex;justify-content:center;gap:6px;padding-top:8px;font-size:13px;color:var(--fg2);min-height:27px}
.ficha>.mancha{position:absolute;inset:0;z-index:0;max-width:none;margin:0;pointer-events:none;transition:clip-path 460ms var(--ease-out)}
.ficha>:not(.mancha){position:relative;z-index:1}
.olvido{display:grid;gap:14px}
.olvido h1{font:700 27px/1.12 var(--display);letter-spacing:-.02em;text-wrap:balance}
.olvido p{color:var(--fg2)}
.campo{display:grid;gap:6px;font-size:14px;font-weight:600}
.campo input{min-height:52px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:19px;font-variant-numeric:tabular-nums}

/* Código */
.acceso{flex:1;display:flex;flex-direction:column;padding-inline:var(--gutter-l) var(--gutter-r);padding-top:env(safe-area-inset-top,0px);overflow:auto}
.acceso>*{width:100%;max-width:400px;margin-inline:auto}
.acceso-c{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:24px}
.acceso h1{font:800 clamp(36px,11vw,46px)/1.02 var(--display);letter-spacing:-.03em;text-wrap:balance}
.acceso p{color:var(--muted)}
.casillas{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.casillas span{display:grid;place-items:center;height:60px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:700 26px var(--display);font-variant-numeric:tabular-nums;transition:border-color 120ms ease}
.casillas span.activa{border-color:var(--text)}
.casillas input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;caret-color:transparent}
.casillas.mal{animation:temblor 260ms var(--ease-out)}
@keyframes temblor{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.acceso .error,.olvido .error,.error{color:var(--red-text);font-weight:600;min-height:22px}
.pasos{display:grid;gap:14px;counter-reset:p}
.pasos li{counter-increment:p;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.pasos li::before{content:counter(p);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:var(--on-red);font-weight:700;font-size:15px}
.pasos svg{width:17px;height:17px;vertical-align:-3px}

/* Panel */
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-inline:var(--gutter-l) var(--gutter-r);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.panel>*{width:100%;max-width:680px;margin-inline:auto}
.barra{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.barra-f{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px}
.panel h1{font:800 32px/1.05 var(--display);letter-spacing:-.025em}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tint);border-radius:10px;padding:2px}
.seg button{min-height:36px;padding-inline:14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);transition:background-color 120ms ease}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(20,20,20,.14)}
.periodo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding-block:4px 12px}
.periodo b{font-weight:700;font-size:17px}.periodo b::first-letter{text-transform:uppercase}
.flecha{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;transition:transform 120ms var(--ease-out),background-color 120ms ease}
.flecha:active{transform:scale(.94);background:var(--tint)}
.flecha:disabled{opacity:.3}
.flecha svg{width:20px;height:20px}
.gente{border-top:1px solid var(--line)}
.fila{display:block;width:100%;text-align:left;padding-block:14px;border-bottom:1px solid var(--line);transition:opacity 120ms ease}
button.fila:active{opacity:.6}
.fila-a{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fila-a .n{font:700 20px var(--display);letter-spacing:-.01em}
.fila-a .t{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fila-a .t span{font-weight:500;font-size:14px;color:var(--muted)}
.fila-b{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px;font-size:14px;color:var(--muted);min-height:24px}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-text);margin-right:6px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.extra{background:var(--red);color:var(--on-red)}
.chip.falta{background:var(--warn-bg);color:var(--warn-text);box-shadow:inset 0 0 0 1px var(--warn-line)}
.cinta{display:block;width:100%;height:14px;margin-top:10px;overflow:visible}
.mini{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini b{display:block;font-weight:600;color:var(--text)}
.nota{margin-top:14px;font-size:14px;color:var(--muted);max-width:60ch}
.semanas{margin-top:8px;display:grid;gap:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.semanas li{display:flex;justify-content:space-between;gap:10px}
.dia{display:block;width:100%;text-align:left;padding-block:12px;border-bottom:1px solid var(--line);transition:opacity 120ms ease}
.dia:active{opacity:.6}
.dia-a{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.dia-a b{font-weight:600;display:block}.dia-a b::first-letter{text-transform:uppercase}
.dia-a .t{font-weight:700;font-variant-numeric:tabular-nums}
.dia .tramos{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.dia .costura{height:14px;margin-top:6px}
.dia.vacio .dia-a b,.dia.vacio .t{color:var(--muted);font-weight:500}
.resumen{display:flex;gap:28px;padding-block:8px 16px}
.resumen dt{font-size:14px;color:var(--muted)}
.resumen dd{margin:0;font:700 24px var(--display);font-variant-numeric:tabular-nums}
.resumen dd.rojo{color:var(--red-text)}
.salir-m{margin-top:18px;min-height:44px;color:var(--muted);font-weight:600;font-size:15px}
.jornada-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;font-size:15px;color:var(--muted)}
.jornada-f b{color:var(--text)}
.jornada-f .enlace{color:var(--red-text)}
.aviso{padding:16px 0;color:var(--muted)}
.aviso .boton{margin-top:10px}

/* Hoja inferior */
.velo{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity 240ms ease}
.velo.ver{opacity:1}
.hoja{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);padding:20px var(--gutter-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gutter-l);transform:translateY(100%);transition:transform 320ms var(--ease-drawer)}
.hoja.ver{transform:none}
.hoja>*{max-width:480px;margin-inline:auto}
.hoja-c{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hoja h2{font:700 22px var(--display);letter-spacing:-.015em}
.hoja h2::first-letter{text-transform:uppercase}
.tramo{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:end;margin-bottom:10px}
.tramo .campo input{background:var(--bg);padding-inline:10px}
.quitar{display:grid;place-items:center;width:44px;height:52px;border-radius:12px;color:var(--muted);transition:background-color 120ms ease}
.quitar:active{background:var(--tint)}
.quitar svg{width:20px;height:20px}
.mas{min-height:44px;font-weight:600;color:var(--red-text)}
.interruptor{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;margin-block:8px;border-block:1px solid var(--line)}
.interruptor small{display:block;color:var(--muted);font-size:13px}
.interruptor input{width:24px;height:24px;flex:none;accent-color:var(--red)}
.hoja .acciones{display:grid;gap:8px;margin-top:6px}
.editado{margin-bottom:10px;font-size:13px;color:var(--muted)}

/* Aviso inferior con deshacer */
.toast{position:absolute;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));z-index:35;width:calc(100% - 40px);max-width:400px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 8px 6px 16px;border-radius:14px;background:var(--toast);color:#F4F4F2;font-weight:500;font-size:15px;box-shadow:0 8px 28px rgba(20,20,20,.28);transform:translate(-50%,10px);opacity:0;transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out)}
.toast.ver{transform:translate(-50%,0);opacity:1}
.toast button{min-height:40px;padding-inline:12px;font-weight:700;color:#fff;text-decoration:underline;text-underline-offset:3px}

/* Vista previa */
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px var(--gutter-r) 8px var(--gutter-l);background:#141414;color:#F4F4F2;font-size:13px;z-index:50}
.demo .seg{background:#2B2B29}
.demo .seg button{color:#C9C9C5;min-height:30px;padding-inline:10px;font-size:13px}
.demo .seg button[aria-pressed="true"]{background:#F4F4F2;color:#141414}

@media (hover:hover) and (pointer:fine){
  .boton.rojo:hover,.fichar:hover{background:var(--red-press)}
  .ficha[data-estado="dentro"] .fichar:hover{background:#F2E4E4}
  button.fila:hover .n,.dia:hover .dia-a b{color:var(--red-text)}
  .flecha:hover{background:var(--tint)}
}
@media (max-height:640px){.centro{gap:14px}.reloj{font-size:58px}.fichar{min-height:76px}}
@media (prefers-reduced-motion:reduce){
  .mancha{transition:none}.casillas.mal{animation:none}
  .hoja,.toast,.velo{transition-duration:1ms}
}

  const pad = n => String(n).padStart(2, "0");

  const olvidado = (s, ahora) => !s.fin && (clave(new Date(s.ini)) !== clave(ahora) || ahora - new Date(s.ini) > 14 * 36e5);

  const minutos = (s, ahora) => {
    if (!s.fin && olvidado(s, ahora)) return 0;
    const fin = s.fin ? new Date(s.fin) : ahora;
    return Math.max(0, Math.round((fin - new Date(s.ini)) / MIN));
  };

  const porDia = (segs, ahora) => {
    const m = {};
    for (const s of segs) { const k = clave(new Date(s.ini)); (m[k] = m[k] || { min: 0, segs: [] }); m[k].min += minutos(s, ahora); m[k].segs.push(s); }

    return m;
  };

  // Un día libre pagado de lunes a viernes rebaja el objetivo de la semana en un quinto.
  const objetivoSemana = (horas, lun, libres) => {
    let dias = 0;
    for (let i = 0; i < 5; i++) if (libres.includes(clave(sumaDias(lun, i)))) dias++;
    return Math.round(horas * 60 * (5 - dias) / 5);
  };

    const fin = sumaDias(lun, 7);
    const mias = segs.filter(s => s.p === persona.id && new Date(s.ini) >= lun && new Date(s.ini) < fin);

    const ol = !s.fin && H.olvidado(s, ahora), fin = s.fin || (ol ? null : ahora);
    if (!fin) return `<line x1="${x(hd(s.ini))}" x2="${x(hd(s.ini) + .5)}" y1="6" y2="6" stroke="var(--warn-line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>`;
    return `<line x1="${x(hd(s.ini))}" x2="${x(hd(fin))}" y1="6" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>`;
  }).join("");
  const marcas = etiquetas ? [8, 12, 16, 20].filter(h => h > a && h < b || h === b).map(h =>
    `<text x="${x(h)}" y="29" text-anchor="${h === b ? "end" : "middle"}">${h}</text>`).join("") : "";
  return `<svg class="costura" aria-hidden="true"><line x1="0" x2="100%" y1="6" y2="6" stroke="var(--raya,var(--line))" stroke-width="1"/>${linea}${marcas}</svg>`;
}

function cinta(total, objetivo) {
  const tope = Math.max(objetivo * 1.15, total, 60), x = m => (m / tope * 100).toFixed(2) + "%";
  const hasta = Math.min(total, objetivo);
  return `<svg class="cinta" aria-hidden="true"><line x1="0" x2="${x(tope)}" y1="7" y2="7" stroke="var(--line)" stroke-width="1"/>
    ${hasta ? `<line x1="0" x2="${x(hasta)}" y1="7" y2="7" stroke="var(--text)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>` : ""}
    ${total > objetivo ? `<line x1="${x(objetivo)}" x2="${x(total)}" y1="7" y2="7" stroke="var(--red-text)" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>` : ""}
    <line x1="${x(objetivo)}" x2="${x(objetivo)}" y1="1" y2="13" stroke="var(--muted)" stroke-width="1.5"/></svg>`;
}

/* ---------- Fichar ---------- */
function vFichar() {

    <header class="cabeza">${logo()}
      ${S.yo.panel ? `<button class="enlace" id="ir-equipo">Equipo ${ICONO.adelante}</button>` : `<button class="enlace" id="yo">${esc(S.yo.nombre)}</button>`}</header>

function refrescarFicha() {
  if (S.vista !== "fichar") return;
  const ahora = new Date(), ab = abierto(), ficha = $("#ficha"), centro = $("#centro"), accion = $("#accion");
  if (!ficha) return;
  if (ab && H.olvidado(ab, ahora)) {
    ficha.dataset.estado = "fuera"; tema();
    if ($("#olv")) return;
    const d = new Date(ab.ini);
    centro.innerHTML = `<div class="olvido" id="olv"><h1>Te faltó fichar la salida del ${fFecha.format(d)}</h1>
      <p>Entraste a las ${H.hora(d)}. Pon la hora a la que saliste y seguimos.</p>
      <label class="campo">Hora de salida<input type="time" id="hsal" value="${d.getHours() < 14 ? "14:00" : "18:00"}"></label>
      <p class="error" id="err" role="alert"></p></div>`;
    accion.innerHTML = `<button class="boton rojo" id="gsal">Guardar salida</button>`;
    $("#gsal").onclick = async ev => {
      const [h, m] = $("#hsal").value.split(":").map(Number);
      const fin = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
      if (isNaN(fin) || fin <= d) { $("#err").textContent = "La salida tiene que ser después de las " + H.hora(d) + "."; return; }
      ev.target.disabled = true;
      try { await api("corregir", { segId: ab.id, fin: fin.toISOString() }); await cargar(); vFichar(); }
      catch (e) { ev.target.disabled = false; if (!caduca(e)) $("#err").textContent = e.servidor ? MENSAJE[e.message] || MENSAJE.horas : MENSAJE.red; }
    };
    return;
  }
  const lun = H.lunes(ahora), hoyK = H.clave(ahora), sem = H.semana(misSegs(), S.yo, lun, S.aus, ahora), hoy = sem.dias[hoyK] || { min: 0, segs: [] };
  ficha.dataset.estado = ab ? "dentro" : "fuera"; tema();
  const h = Math.floor(hoy.min / 60), m = hoy.min % 60;
  const texto = ab ? `Dentro desde las ${H.hora(ab.ini)}` : hoy.segs.length ? `Fuera desde las ${H.hora(hoy.segs[hoy.segs.length - 1].fin)}` : "Aún no has fichado hoy";
  if (!$("#reloj")) {
    centro.innerHTML = `<div><p class="estado" id="f-est"></p><p class="reloj" id="reloj" aria-live="off"></p><p class="pie-reloj">hoy</p></div>
      <div id="f-cos"></div><div><div class="semana-cab"><span>Esta semana</span><b id="f-sem"></b></div><ol class="dias" id="f-dias"></ol></div>`;
    accion.innerHTML = `<button class="boton fichar" id="fichar"></button><div class="pendiente" id="pend" role="status"></div>`;
    $("#fichar").onclick = pulsar;
  }
  $("#f-est").textContent = texto;
  $("#reloj").innerHTML = `${h}<small>h</small>${H.pad(m)}<small>min</small>`;
  $("#reloj").setAttribute("aria-label", H.largo(hoy.min) + " hoy");
  $("#f-cos").innerHTML = costura(hoy.segs, H.inicioDia(ahora), ahora, true);
  $("#f-sem").innerHTML = `${H.hm(sem.total)} <span>de ${H.hm(sem.objetivo).replace(":00", "")} h</span>`;
  $("#f-dias").innerHTML = DIAS.map((d, i) => {
    const k = H.clave(H.sumaDias(lun, i)), x = sem.dias[k], lib = sem.libres.includes(k);
    return `<li class="${k === hoyK ? "hoy" : ""}"><span>${d}</span><b>${lib ? "libre" : x && x.min ? H.hm(x.min) : "–"}</b></li>`;
  }).join("");
  $("#fichar").textContent = ab ? "Fichar salida" : "Fichar entrada";
  pintarPendiente();
}

function tema() {
  const ficha = $("#ficha"), dentro = ficha && ficha.dataset.estado === "dentro";
  const fondo = getComputedStyle(document.documentElement);
  const c = (dentro ? fondo.getPropertyValue("--red") : fondo.getPropertyValue("--bg")).trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = c);
}

function pintarPendiente() {
  const p = $("#pend"); if (!p) return;
  p.textContent = S.cola.length ? (S.sinRed ? "Sin cobertura. Guardado en el móvil, se enviará solo." : "Enviando…") : "";
}

function mancha(ev, nuevo) {
  const ficha = $("#ficha");
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return () => {};
  const viejo = getComputedStyle(ficha).backgroundColor, r = ficha.getBoundingClientRect(), b = ev.currentTarget.getBoundingClientRect();
  const x = (ev.clientX || b.left + b.width / 2) - r.left, y = (ev.clientY || b.top + b.height / 2) - r.top;
  const fin = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) + 8;
  const el = document.createElement("div"); el.className = "mancha"; el.style.background = nuevo;
  el.style.clipPath = `circle(0px at ${x}px ${y}px)`; ficha.prepend(el);
  ficha.style.transition = "none"; ficha.style.backgroundColor = viejo;
  const acabar = () => { ficha.style.backgroundColor = ""; ficha.style.transition = ""; el.remove(); };
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.clipPath = `circle(${fin}px at ${x}px ${y}px)`; }));
  el.addEventListener("transitionend", acabar, { once: true });
  setTimeout(acabar, 900);
}

function pulsar(ev) {
  const ab = abierto(), accion2 = ab ? "salida" : "entrada", at = new Date().toISOString();
  const act = { id: uid(), accion2, at, segId: ab ? ab.id : null };
  if (accion2 === "entrada") act.segId = act.id;
  const css = getComputedStyle(document.documentElement);
  mancha(ev, (ab ? css.getPropertyValue("--bg") : css.getPropertyValue("--red")).trim());
  vibrar();
  S.cola.push(act); guardar("cola", S.cola);
  refrescarFicha();
  toast(`${ab ? "Salida" : "Entrada"} a las ${H.hora(at)}`, () => deshacer(act));
  vaciarCola();
}

async function deshacer(act) {
  const i = S.cola.findIndex(a => a.id === act.id);
  if (i > 0 || (i === 0 && !S.enviando)) { S.cola.splice(i, 1); guardar("cola", S.cola); refrescarFicha(); return; }
  try {
    while (S.enviando) await new Promise(r => setTimeout(r, 120));
    await api("deshacer", { accion2: act.accion2, segId: act.segId });
    if (act.accion2 === "entrada") S.segs = S.segs.filter(s => s.id !== act.segId);
    await cargar();
  } catch (e) { toast(e.servidor ? MENSAJE[e.message] || "No se ha podido deshacer." : MENSAJE.red); }
}

let tToast = null;
function toast(texto, deshacerFn) {
  const v = $(".toast"); if (v) v.remove();
  clearTimeout(tToast);
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(texto)}</span>${deshacerFn ? "<button>Deshacer</button>" : ""}`;
  app.append(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("ver")));
  const quitar = () => { t.classList.remove("ver"); setTimeout(() => t.remove(), 220); };
  if (deshacerFn) $("button", t).onclick = () => { clearTimeout(tToast); quitar(); deshacerFn(); };
  tToast = setTimeout(quitar, 7000);
}

/* ---------- Hoja inferior ---------- */
function abrirHoja(html) {

}

/* ---------- Equipo ---------- */
const rango = () => {
  if (S.modo === "semana") return { desde: S.lun, hasta: H.sumaDias(S.lun, 7) };
  const ls = H.lunesDelMes(S.mes.getFullYear(), S.mes.getMonth());
  return { desde: ls[0], hasta: H.sumaDias(ls[ls.length - 1], 7) };
};
async function cargarEquipo() {
  const r = rango();
  const j = await api("estado", { desde: r.desde.toISOString(), hasta: r.hasta.toISOString(), todos: true });
  S.equipo = j;
}

function marco(titulo, atras, cuerpo, derecha = "") {
  S.scroll = 0;
  app.innerHTML = `<main class="panel" id="panel"><div class="barra"><div class="barra-f">
    <button class="enlace" id="atras">${ICONO.atras} ${atras}</button>${derecha}</div></div>
    <h1>${esc(titulo)}</h1><div id="cuerpo">${cuerpo}</div></main>`;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
}
const periodo = () => {
  const r = S.modo === "semana";
  const t = r ? `${fCorta.format(S.lun)} – ${fCorta.format(H.sumaDias(S.lun, 6))}` : fMes.format(S.mes);
  const fut = r ? H.sumaDias(S.lun, 7) > new Date() : new Date(S.mes.getFullYear(), S.mes.getMonth() + 1, 1) > new Date();
  return `<div class="periodo"><button class="flecha" id="ant" aria-label="Anterior">${ICONO.atras}</button><b class="num">${t}</b>
    <button class="flecha" id="sig" aria-label="Siguiente" ${fut ? "disabled" : ""}>${ICONO.adelante}</button></div>`;
};
function moverPeriodo(n) {
  if (S.modo === "semana") S.lun = H.sumaDias(S.lun, 7 * n);
  else S.mes = new Date(S.mes.getFullYear(), S.mes.getMonth() + n, 1);
}

async function vEquipo() {
  S.vista = "equipo";
  marco("Equipo", "Fichar", `<div id="contenido" class="aviso">Cargando horas…</div>`,
    `<div class="seg" role="group" aria-label="Periodo"><button id="m-sem" aria-pressed="${S.modo === "semana"}">Semana</button><button id="m-mes" aria-pressed="${S.modo === "mes"}">Mes</button></div>`);
  $("#atras").onclick = () => { S.lun = H.lunes(new Date()); vFichar(); cargar(); };
  $("#m-sem").onclick = () => { S.modo = "semana"; vEquipo(); };
  $("#m-mes").onclick = () => { S.modo = "mes"; vEquipo(); };
  try { await cargarEquipo(); }
  catch (e) {
    if (caduca(e)) return;
    $("#contenido").innerHTML = `No se han podido cargar las horas.<button class="boton suave" id="reint">Reintentar</button>`;
    $("#reint").onclick = vEquipo; return;
  }
  if (S.vista === "equipo") pintarEquipo();
}

function pintarEquipo() {
  const ahora = new Date(), { personas, segmentos, ausencias } = S.equipo, c = $("#contenido");
  if (!c) return;
  c.className = "";
  let filas;
  if (S.modo === "semana") {
    filas = personas.map(p => {
      const s = H.semana(segmentos, p, S.lun, ausencias, ahora), ab = segmentos.find(x => x.p === p.id && !x.fin && !H.olvidado(x, ahora));
      const olv = segmentos.some(x => x.p === p.id && H.olvidado(x, ahora));
      const estado = ab ? `<span><i class="punto"></i>Dentro desde ${H.hora(ab.ini)}</span>` : `<span>Fuera</span>`;
      const chip = olv ? `<span class="chip falta">Falta salida</span>` : s.extra ? `<span class="chip extra">+${H.hm(s.extra)} extras</span>` : "";
      return `<button class="fila" data-p="${p.id}"><div class="fila-a"><span class="n">${esc(p.nombre)}</span>
        <span class="t">${H.hm(s.total)} <span>de ${H.hm(s.objetivo).replace(":00", "")}</span></span></div>
        <div class="fila-b">${estado}${chip}</div>${cinta(s.total, s.objetivo)}
        <div class="mini">${DIAS.map((d, i) => { const k = H.clave(H.sumaDias(S.lun, i)), x = s.dias[k]; return `<span>${d}<b>${s.libres.includes(k) ? "libre" : x && x.min ? H.hm(x.min) : "–"}</b></span>`; }).join("")}</div></button>`;
    }).join("");
  } else {
    const ls = H.lunesDelMes(S.mes.getFullYear(), S.mes.getMonth());
    filas = personas.map(p => {
      const ss = ls.map(l => H.semana(segmentos, p, l, ausencias, ahora));
      const tot = ss.reduce((a, s) => a + s.total, 0), ex = ss.reduce((a, s) => a + s.extra, 0);
      return `<div class="fila"><div class="fila-a"><span class="n">${esc(p.nombre)}</span><span class="t">${H.hm(tot)}</span></div>
        <div class="fila-b"><span>horas en total</span>${ex ? `<span class="chip extra">+${H.hm(ex)} extras</span>` : `<span>Sin extras</span>`}</div>
        <ul class="semanas">${ss.map(s => `<li><span>${fCorta.format(s.lun)}</span><span>${H.hm(s.total)}${s.extra ? ` · +${H.hm(s.extra)}` : ""}</span></li>`).join("")}</ul></div>`;
    }).join("");
  }
  c.innerHTML = `${periodo()}<div class="gente">${filas}</div>
    <p class="nota">${S.modo === "semana" ? "Son extras las horas que pasan de la jornada semanal. Los días libres pagados rebajan esa jornada." : "Cada semana cuenta en el mes de su lunes para no partir las extras entre dos meses."}</p>
    ${CFG.demo ? "" : `<button class="salir-m" id="salir-m">Salir de este móvil</button>`}`;
  const sm = $("#salir-m"); if (sm) sm.onclick = salir;
  $("#ant").onclick = () => { moverPeriodo(-1); vEquipo(); };
  $("#sig").onclick = () => { moverPeriodo(1); vEquipo(); };
  c.querySelectorAll("button.fila").forEach(b => b.onclick = () => { S.persona = b.dataset.p; vPersona(); });
}

function vPersona() {
  S.vista = "persona";
  const ahora = new Date(), { personas, segmentos, ausencias } = S.equipo, p = personas.find(x => x.id === S.persona);
  const s = H.semana(segmentos, p, S.lun, ausencias, ahora);
  const dias = DIAS.map((_, i) => {
    const d = H.sumaDias(S.lun, i), k = H.clave(d), x = s.dias[k], lib = s.libres.includes(k), fut = d > ahora;
    const tramos = x ? x.segs.map(t => `${H.hora(t.ini)}–${t.fin ? H.hora(t.fin) : H.olvidado(t, ahora) ? "falta salida" : "ahora"}`).join(" · ") : lib ? "Día libre pagado" : "";
    return `<button class="dia ${x ? "" : "vacio"}" data-d="${k}" ${fut ? "disabled" : ""}><div class="dia-a"><b>${fFecha.format(d)}</b><span class="t">${x && x.min ? H.hm(x.min) : "–"}</span></div>
      ${tramos ? `<div class="tramos">${tramos}</div>` : ""}${x ? costura(x.segs, d, ahora, false) : ""}</button>`;
  }).join("");
  marco(p.nombre, "Equipo", `${periodo()}<dl class="resumen"><div><dt>Horas</dt><dd>${H.hm(s.total)}</dd></div><div><dt>Jornada</dt><dd>${H.hm(s.objetivo)}</dd></div>
    <div><dt>Extras</dt><dd class="${s.extra ? "rojo" : ""}">${s.extra ? "+" + H.hm(s.extra) : "0:00"}</dd></div></dl>
    <div class="jornada-f"><span>Jornada semanal: <b class="num">${String(p.horas).replace(".", ",")} h</b></span><button class="enlace" id="c-jor">Cambiar</button></div><div class="gente">${dias}</div>`);
  $("#c-jor").onclick = () => hojaJornada(p);
  $("#atras").onclick = vEquipo;
  $("#ant").onclick = async () => { moverPeriodo(-1); await recargarPersona(); };
  $("#sig").onclick = async () => { moverPeriodo(1); await recargarPersona(); };
  document.querySelectorAll(".dia").forEach(b => b.onclick = () => hojaDia(p, b.dataset.d));
}
async function recargarPersona() {
  S.modo = "semana";
  try { await cargarEquipo(); vPersona(); } catch (e) { if (!caduca(e)) toast("No se han podido cargar las horas."); }
}

function hojaJornada(p) {
  const h = abrirHoja(`<div class="hoja-c"><h2>Jornada de ${esc(p.nombre)}</h2><button class="flecha" id="cerrar-h" aria-label="Cerrar">${ICONO.quitar}</button></div>
    <label class="campo">Horas a la semana<input id="horas" inputmode="decimal" value="${String(p.horas).replace(".", ",")}"></label>
    <p class="editado" style="margin-top:8px">Lo que pase de estas horas cuenta como extra. También se recalculan las semanas anteriores.</p>
    <p class="error" id="err" role="alert"></p><div class="acciones"><button class="boton rojo" id="guardar">Guardar</button></div>`);
  $("#cerrar-h", h).onclick = () => cerrarHoja();
  $("#guardar", h).onclick = async ev => {
    const n = Number($("#horas", h).value.replace(",", ".")), err = $("#err", h);
    if (!(n > 0 && n <= 60)) { err.textContent = MENSAJE.jornada; return; }
    ev.target.disabled = true;
    try { await api("jornada", { persona: p.id, horas: n }); await cargarEquipo(); cerrarHoja(); vPersona(); toast("Jornada guardada"); }
    catch (e) { ev.target.disabled = false; if (!caduca(e)) err.textContent = e.servidor ? MENSAJE[e.message] || "No se ha podido guardar." : MENSAJE.red; }
  };
}

function hojaDia(p, k) {
  const [a, m, d] = k.split("-").map(Number), dia = new Date(a, m - 1, d), ahora = new Date();
  const segs = S.equipo.segmentos.filter(s => s.p === p.id && H.clave(new Date(s.ini)) === k).sort((x, y) => new Date(x.ini) - new Date(y.ini));
  const libre = S.equipo.ausencias.some(x => x.p === p.id && x.fecha === k);
  const fila = (s, i) => `<div class="tramo" data-id="${s ? s.id : ""}"><label class="campo">Entrada<input type="time" id="ini${i}" value="${s ? H.hora(s.ini) : ""}"></label>
    <label class="campo">Salida<input type="time" id="fin${i}" value="${s && s.fin ? H.hora(s.fin) : ""}"></label>
    <button class="quitar" aria-label="Quitar tramo">${ICONO.quitar}</button></div>`;
  const notas = segs.map(s => s.nota).filter(Boolean);
  const h = abrirHoja(`<div class="hoja-c"><h2>${fFecha.format(dia)}</h2><button class="flecha" id="cerrar-h" aria-label="Cerrar">${ICONO.quitar}</button></div>
    <div id="tramos">${segs.map(fila).join("")}</div><button class="mas" id="mas">Añadir tramo</button>
    <label class="interruptor"><span>Día libre pagado<small>Festivo, vacaciones o baja. Rebaja la jornada de esa semana.</small></span><input type="checkbox" id="libre" ${libre ? "checked" : ""}></label>
    ${notas.length ? `<p class="editado">${esc(notas.join(" · "))}</p>` : ""}<p class="error" id="err" role="alert"></p>
    <div class="acciones"><button class="boton rojo" id="guardar">Guardar</button></div>`);
  let n = segs.length, borrados = [];
  const atarQuitar = t => { $(".quitar", t).onclick = () => { if (t.dataset.id) borrados.push(t.dataset.id); t.remove(); }; };
  h.querySelectorAll(".tramo").forEach(atarQuitar);
  $("#cerrar-h", h).onclick = () => cerrarHoja();
  $("#mas", h).onclick = () => { $("#tramos", h).insertAdjacentHTML("beforeend", fila(null, n++)); atarQuitar($("#tramos", h).lastElementChild); };
  $("#guardar", h).onclick = async ev => {
    const err = $("#err", h), hora = v => { if (!v) return null; const [x, y] = v.split(":").map(Number); return new Date(a, m - 1, d, x, y); };
    const ops = [];
    for (const t of h.querySelectorAll(".tramo")) {
      const [i, f] = t.querySelectorAll("input"), ini = hora(i.value), fin = hora(f.value), o = segs.find(s => s.id === t.dataset.id);
      if (!ini && !fin) continue;
      if (!ini || (fin && fin <= ini) || (fin && fin > ahora) || ini > ahora) { err.textContent = MENSAJE.horas; return; }
      if (!o) ops.push(["crear", { persona: p.id, ini: ini.toISOString(), fin: fin ? fin.toISOString() : null }]);
      else if (H.hora(o.ini) !== i.value || (o.fin ? H.hora(o.fin) : "") !== f.value) ops.push(["corregir", { segId: o.id, ini: ini.toISOString(), fin: fin ? fin.toISOString() : null }]);
    }
    borrados.forEach(id => ops.unshift(["corregir", { segId: id, borrar: true }]));
    const lib = $("#libre", h).checked;
    if (lib !== libre) ops.push(["ausencia", { persona: p.id, fecha: k, activa: lib }]);
    ev.target.disabled = true; ev.target.textContent = "Guardando…";
    try {
      for (const [ac, dat] of ops) await api(ac, dat);
      await cargarEquipo(); cerrarHoja(); vPersona(); toast("Guardado");
    } catch (e) {
      ev.target.disabled = false; ev.target.textContent = "Guardar";
      if (!caduca(e)) err.textContent = e.servidor ? MENSAJE[e.message] || "No se ha podido guardar." : MENSAJE.red;
    }
  };
}

  if (enSafariSinInstalar() && !S.token) return vInstalar();
  if (!S.token) return vAcceso();
  vFichar(); cargar(); vaciarCola();
}
setInterval(() => { if (S.vista === "fichar") refrescarFicha(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.token) { if (S.vista === "fichar") { refrescarFicha(); vaciarCola(); cargar(); } } });
addEventListener("online", vaciarCola);
if (CFG.demo) {
  const b = document.createElement("div"); b.className = "demo";
  b.innerHTML = `<span>Ejemplo</span><div class="seg" role="group" aria-label="Ver como"><button data-c="a" aria-pressed="true">Alex</button><button data-c="m" aria-pressed="false">Trabajadora</button><button data-c="" aria-pressed="false">Código</button></div>`;
  document.body.insertBefore(b, app); document.body.style.display = "flex"; document.body.style.flexDirection = "column"; app.style.flex = "1"; app.style.minHeight = "0";
  b.querySelectorAll("button").forEach(x => x.onclick = () => {
    b.querySelectorAll("button").forEach(y => y.setAttribute("aria-pressed", y === x));
    S.token = x.dataset.c || null; S.cola = []; S.segs = []; S.aus = []; cerrarHoja(true);
    S.yo = S.token ? Demo.personas.find(p => p.id === S.token) : null;
    if (S.token) { vFichar(); cargar(); } else vAcceso();
  });
  S.token = "a"; S.yo = Demo.personas[0]; S.cola = []; S.segs = [];
  vFichar(); cargar();
} else {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  inicio();
}
})();
