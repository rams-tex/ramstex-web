name: Publicar web
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Importar catálogo", "Importar catálogo TopTex", "Actualizar stock", "Fotos Sol's", "Importar Stanley Stella", "Importar Falk&Ross", "Importar Makito", "Encuadre de fotos del diseñador"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recuperar fotos de Stanley/Stella (se sirven desde la web)
        uses: actions/cache/restore@v4
        with:
          path: stimg
          key: stimg-v1-${{ hashFiles('data/stanley.json') }}
          restore-keys: stimg-v1-
      - name: Descargar las fotos que falten
        run: |
          npm install --no-save sharp@0.33
          node scripts/stanley-fotos.mjs stimg
      - name: Guardar fotos para la próxima vez
        uses: actions/cache/save@v4
        with:
          path: stimg
          key: stimg-v1-${{ hashFiles('data/stanley.json') }}
        continue-on-error: true
      - name: Recuperar fotos de Makito (se sirven desde la web; las descarga «Importar Makito»)
        uses: actions/cache/restore@v4
        with:
          path: mkimg
          key: mkimg-v2-${{ github.run_id }}
          restore-keys: mkimg-v2-
      - name: Preparar archivos de la web (sin datos internos)
        run: |
          mkdir -p _site/data
          cp index.html logo.png favicon.ico favicon-32.png favicon-192.png apple-touch-icon.png portada.webp portada-900.webp portada-900.png taller.jpg taller-900.jpg merch-home.jpg merch-home-900.jpg _site/
          cp -r foto img portada casos _site/
          cp data/catalogo.json _site/data/
          if [ -d data/encuadres ]; then cp -r data/encuadres _site/data/; fi
          cp -r data/fichas _site/data/
          if [ -d data/stock ]; then cp -r data/stock _site/data/; fi
          sed -i "s/var BUILD=\"dev\"/var BUILD=\"$(date +%s)\"/" _site/index.html
          node scripts/paginas-seo.mjs _site
          mkdir -p _site/st && cp stimg/*.webp _site/st/ 2>/dev/null || true
          mkdir -p _site/mk && cp mkimg/*.webp _site/mk/ 2>/dev/null || true
          # Diseñador de merchandising: zonas de marcaje de Makito (copia reducida) y previsualizaciones limpias, si ya están en el repositorio
          node scripts/marcaje-web.mjs data/makito-marcaje _site/data/marcaje
          if [ -d mkz ]; then cp -r mkz _site/; fi
          echo "ramstex.com" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
