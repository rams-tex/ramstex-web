name: Publicar web
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Importar catálogo TopTex"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar archivos de la web (sin datos internos)
        run: |
          mkdir -p _site/data
          cp index.html logo.png favicon.ico favicon-32.png favicon-192.png apple-touch-icon.png portada.webp portada-900.webp portada-900.png taller.jpg taller-900.jpg _site/
          cp -r foto img _site/
          cp data/catalogo.json _site/data/
          cp -r data/fichas _site/data/
          echo "ramstex.com" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
