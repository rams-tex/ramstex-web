name: Fotos portada (prueba)
on:
  push:
    branches: [prueba-portada]
    paths: [".github/workflows/portada-fotos.yml", "portada-lista.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos de producto
        run: |
          mkdir -p portada-src5
          while read -r n u; do
            [ -z "$n" ] && continue
            ext=jpg; case "$u" in *.png|*png-alpha) ext=png;; esac
            curl -sfL --max-time 60 -A "Mozilla/5.0" -o "portada-src5/$n.$ext" "$u" || echo "FALLO $n"
          done < portada-lista.txt
          find portada-src5 -size 0 -delete; ls -la portada-src5
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add portada-src5
          git diff --cached --quiet || git commit -m "Fotos para la prueba de portada [skip netlify]"
          git push
