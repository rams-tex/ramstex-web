name: Fotos portada (prueba)
on:
  push:
    branches: [prueba-portada]
    paths: [".github/workflows/portada-fotos.yml", "portada-lista.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos de producto
        run: |
          mkdir -p rams23-jk
          while read -r n u; do
            [ -z "$n" ] && continue
            ext=jpg; case "$u" in *.png|*png-alpha) ext=png;; esac
            curl -sfL --max-time 60 -A "Mozilla/5.0" -o "rams23-jk/$n.$ext" "$u" || echo "FALLO $n"
          done < portada-lista.txt
          find rams23-jk -size 0 -delete; ls -la rams23-jk
      - name: Cabeceras CORS (diseñador)
        run: |
          for u in "https://cdn.europeancatalog.com/packshots/PS_K356_WHITE.png?w=700" "https://cdn.toptex.com/packshots/PS_K356_WHITE.png" "https://s7g3.scene7.com/is/image/soloinvest/n11380102A?wid=700" "https://static.gorfactory.es/images/models/6502/views/large/p_6502_01_1_1.jpg" "https://s3-eu-west-1.amazonaws.com/resources.jhktshirt.com/pictures/sku/jhktshirt_tsra150_wh.jpg" "https://download.falk-ross.eu/ws/picture/100_54_000_f-2022_01.jpg"; do
            echo "== $u"; curl -s -o /dev/null -D - --max-time 30 -A "Mozilla/5.0" -H "Origin: https://ramstex.com" "$u" | grep -i -E "^(HTTP|access-control|content-type)" || true
          done > rams23-jk/dz-cors.txt 2>&1
          for u in x; do :
          done
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rams23-jk
          git diff --cached --quiet || git commit -m "Fotos para la prueba de portada [skip netlify]"
          git push
