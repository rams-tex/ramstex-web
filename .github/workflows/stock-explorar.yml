name: Prueba stock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/stock-explorar.mjs
        continue-on-error: true
        env:
          TOPTEX_API_KEY: ${{ secrets.TOPTEX_API_KEY }}
          TOPTEX_USER: ${{ secrets.TOPTEX_USER }}
          TOPTEX_PASSWORD: ${{ secrets.TOPTEX_PASSWORD }}
          ROLY_USER: ${{ secrets.ROLY_USER }}
          ROLY_PASSWORD: ${{ secrets.ROLY_PASSWORD }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B diagnostico
          git add -f diagnostico/stock.txt
          git commit -m "Resultado prueba stock" || true
          git push -f origin diagnostico
