name: Prueba TopTex archivo completo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/toptex-archivo.mjs
        continue-on-error: true
        env:
          TOPTEX_API_KEY: ${{ secrets.TOPTEX_API_KEY }}
          TOPTEX_USER: ${{ secrets.TOPTEX_USER }}
          TOPTEX_PASSWORD: ${{ secrets.TOPTEX_PASSWORD }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B diagnostico-toptex
          git add -f diagnostico/toptex-archivo.txt
          git commit -m "Prueba archivo TopTex"
          git push -f origin diagnostico-toptex
