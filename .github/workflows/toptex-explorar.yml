name: Prueba API TopTex
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/toptex-explorar.mjs
        continue-on-error: true
        env:
          TOPTEX_API_KEY: ${{ secrets.TOPTEX_API_KEY }}
          TOPTEX_USER: ${{ secrets.TOPTEX_USER }}
          TOPTEX_PASSWORD: ${{ secrets.TOPTEX_PASSWORD }}
      - name: Guardar resultado en la rama diagnostico-toptex
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          ls -la diagnostico || true
          git checkout -B diagnostico-toptex
          git add -f diagnostico/toptex.txt
          git commit -m "Resultado prueba API TopTex"
          git push -f origin diagnostico-toptex
