name: Huellas de fotos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  huellas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fotos-huella.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/huellas.json
          git diff --cached --quiet || git commit -m "Huellas de fotos [skip netlify]"
          git push
