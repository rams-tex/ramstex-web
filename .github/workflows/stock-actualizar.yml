name: Actualizar stock
on:
  workflow_dispatch:
  schedule:
    - cron: "47 5,12 * * *"
permissions:
  contents: write
concurrency:
  group: datos
jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/stock-actualizar.mjs
        env:
          TOPTEX_API_KEY: ${{ secrets.TOPTEX_API_KEY }}
          TOPTEX_USER: ${{ secrets.TOPTEX_USER }}
          TOPTEX_PASSWORD: ${{ secrets.TOPTEX_PASSWORD }}
          ROLY_USER: ${{ secrets.ROLY_USER }}
          ROLY_PASSWORD: ${{ secrets.ROLY_PASSWORD }}
          JHK_TOKEN: ${{ secrets.JHK_TOKEN }}
      - name: Guardar stock
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/stock
          git diff --cached --quiet || git commit -m "Stock actualizado [skip netlify]"
          git pull --rebase -q || true
          git push
