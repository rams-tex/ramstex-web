name: Importar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
concurrency:
  group: datos
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/toptex-importar.mjs
        env:
          TOPTEX_API_KEY: ${{ secrets.TOPTEX_API_KEY }}
          TOPTEX_USER: ${{ secrets.TOPTEX_USER }}
          TOPTEX_PASSWORD: ${{ secrets.TOPTEX_PASSWORD }}
      - run: node scripts/roly-importar.mjs
        continue-on-error: true
        env:
          ROLY_USER: ${{ secrets.ROLY_USER }}
          ROLY_PASSWORD: ${{ secrets.ROLY_PASSWORD }}
      - run: node scripts/jhk-importar.mjs
        continue-on-error: true
        env:
          JHK_TOKEN: ${{ secrets.JHK_TOKEN }}
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fotos-huella.mjs
        continue-on-error: true
      - run: node scripts/catalogo-construir.mjs
      - name: Guardar catálogo actualizado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Catálogo actualizado"
          git pull --rebase -q || true
          git push
